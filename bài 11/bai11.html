<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 11</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style11.css">
</head>

<body class="bg-dark text-light">
    <div class="container-fluid p-4">
        <div class="text-center mb-4">
            <h1 class="fw-bold">Thư viện ảnh Việt Nam</h1>
            <p class="text-secondary fs-5">
                Bộ sưu tập 6 danh thắng tiêu biểu — minh họa thẻ figure / figcaption.
            </p>
        </div>

        <div class="d-grid gap-4" style="grid-template-columns: 1fr 1fr 1fr;">
            <div class="bg-secondary rounded-4 overflow-hidden">
                <img src="./images/1-vinh-ha-long.jpg"
                     class="object-fit-cover rounded w-100"
                     style="height: 215px;"
                     alt="Vịnh Hạ Long">
                <div class="p-3 bg-secondary-subtle text-dark">
                    Hình 1. Vịnh Hạ Long
                </div>
            </div>

            <div class="bg-secondary rounded-4 overflow-hidden">
                <img src="./images/2-son-doong.jpg"
                     class="object-fit-cover rounded w-100"
                     style="height: 215px;"
                     alt="Hang Sơn Đoòng">
                <div class="p-3 bg-secondary-subtle text-dark">
                    Hình 2. Hang Sơn Đoòng
                </div>
            </div>

            <div class="bg-secondary rounded-4 overflow-hidden">
                <img src="./images/3-thac-ban-gioc.jpg"
                    class="object-fit-cover rounded w-100"
                     style="height: 215px;"
                     alt="Thác Bản Giốc">
                <div class="p-3 bg-secondary-subtle text-dark">
                    Hình 3. Thác Bản Giốc
                </div>
            </div>

            <div class="bg-secondary rounded-4 overflow-hidden">
                <img src="./images/4-fansipan.jpg"
                     class="object-fit-cover rounded w-100"
                     style="height: 215px;"
                     alt="Fansipan">
                <div class="p-3 bg-secondary-subtle text-dark">
                    Hình 4. Fansipan
                </div>
            </div>

            <div class="bg-secondary rounded-4 overflow-hidden">
                <img src="./images/5-mekong.jpg"
                     class="object-fit-cover rounded w-100"
                     style="height: 215px;"
                     alt="Đồng bằng sông Cửu Long">
                <div class="p-3 bg-secondary-subtle text-dark">
                    Hình 5. Đồng bằng sông Cửu Long
                </div>
            </div>

            <div class="bg-secondary rounded-4 overflow-hidden">
                <img src="./images/6-phong-nha.jpg"
                     class="object-fit-cover rounded w-100"
                     style="height: 215px;"
                     alt="Động Phong Nha">
                <div class="p-3 bg-secondary-subtle text-dark">
                    Hình 6. Động Phong Nha
                </div>
            </div>

        </div>
    </div>

</body>
</html>
