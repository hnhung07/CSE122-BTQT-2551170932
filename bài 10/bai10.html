<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 10</title>
    <link  rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style10.css">
</head>

<body>
    <div class="container my-5" style="max-width: 1000px;">
        <div class="card border-0 shadow rounded-4 overflow-hidden">
            <div class="card-header p-4">
                <h1 class="fw-bold fs-3">Liên hệ với chúng tôi</h1>
                <p class="fs-6 mb-0">
                    Vui lòng điền thông tin bên dưới, chúng tôi sẽ phản hồi trong 24 giờ.
                </p>
            </div>

            <div class="card-body p-4">
                <form>
                    <div class="row g-3">

                        <!-- Họ và tên -->
                        <div class="col-md-6">
                            <label for="hoten" class="form-label fw-bold text-secondary">
                                Họ và tên
                            </label>
                            <input type="text" class="form-control"
                                   id="hoten" name="hoten"
                                   value="Nguyễn Văn An" required>
                        </div>

                        <div class="col-md-6">
                            <label for="email" class="form-label fw-bold text-secondary">
                                Email
                            </label>
                            <input type="email" class="form-control"
                                   id="email" name="email"
                                   value="an.nv@tlu.edu.vn" required>
                        </div>

                        <div class="col-md-6">
                            <label for="sdt" class="form-label fw-bold text-secondary">
                                Số điện thoại
                            </label>
                            <input type="tel" class="form-control"
                                   id="sdt" name="sdt"
                                   value="0987 654 321">
                        </div>
                        
                        <div class="col-md-6">
                            <label for="chude" class="form-label fw-bold text-secondary">
                                Chủ đề
                            </label>
                            <select class="form-select" id="chude" name="chude">
                                <option value="khoahoc" selected>Hỏi về khoá học</option>
                                <option value="baitap">Hỏi về bài tập</option>
                                <option value="hocphi">Hỏi về học phí</option>
                                <option value="khac">Khác</option>
                            </select>
                        </div>

                        <div class="col-12">
                            <label for="noidung" class="form-label fw-bold text-secondary">
                                Nội dung
                            </label>
                            <div class="form-floating">
                                <textarea class="form-control" placeholder="Leave a comment here" id="floatingTextarea"></textarea>
                            </div>
                           
                        </div>

                        <div class="col-12 mt-4">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox"
                                       id="dongy" name="dongy" checked>
                                <label class="form-check-label text-secondary"
                                       for="dongy">
                                    Tôi đồng ý nhận email phản hồi.
                                </label>
                            </div>
                        </div>

                        <div class="col-12 mt-4">
                            <button type="submit" class="btn btn-submit btn-lg-2">
                                Gửi liên hệ
                            </button>

                            <button type="reset" class="btn btn-reset btn-lg-2">
                                Nhập lại
                            </button>
                        </div>

                    </div>
                </form>

            </div>
        </div>
    </div>

</body>
</html>
```
