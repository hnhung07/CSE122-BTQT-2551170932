<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 16</title>
    <link rel="stylesheet" href="style16.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Danh sách việc cần làm</h1>
            <p>Thêm việc mới, đánh dấu hoàn thành hoặc xoá - tất cả bằng JavaScript.</p>
        </div>

        <div class="add-task">
            <input type="text" id="taskInput" placeholder="Nhập công việc cần làm...">
            <button id="addButton">Thêm</button>
        </div>

        <div class="task-list" id="taskList"></div>

        <p class="count" id="count">Còn 0 việc chưa hoàn thành</p>
    </div>

    <script src="bai16.js"></script>
</body>
</html>
