<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 12</title>
    <link rel="stylesheet" href="style12.css">
</head>
<body>
    <div class="container">
        <div class="calendar">
            <p class="year">2026</p>
            <h2 class="month">Tháng 12</h2>
            <h1 class="date">15</h1>
            <h2 class="day">Thứ năm</h2>
        </div>

        <p class="greeting">Chào buổi sáng!</p>

        <div class="form">
            <div>
                <label for="inputDate">Ngày</label>
                <input type="number" id="inputDate" min="1" max="31" value="15">
            </div>

            <div>
                <label for="inputMonth">Tháng</label>
                <input type="number" id="inputMonth" min="1" max="12" value="10">
            </div>

            <div>
                <label for="inputYear">Năm</label>
                <input type="number" id="inputYear" min="1" value="2026">
            </div>

            <button class="btn_inputCalendar">In lịch</button>
        </div>

        <p class="message"></p>
    </div>

    <script src="bai12.js"></script>
</body>
</html>
