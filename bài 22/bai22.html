<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bài 22</title>
    <link rel="stylesheet" href="style22.css">
</head>
<body class="dark">
    <div class="top-bar">
        <h1>Chế độ Tối/Sáng</h1>
        <div class="toggle" id="toggle"></div>
    </div>
    <div class="card">
        <div class="card-title">Biến CSS(CSS Variables)</div>
        <div class="card-text">Toàn bộ màu sắc được khai báo trong <code>:root</code> và ghi đè bằng class <code>.toi</code>.</div>
    </div>
    <div class="card">
        <div class="card-title">Chuyển đổi bằng JavaScript</div>
        <div class="card-text">Nút gạt thêm/bỏ class <code>.toi</code> trên &lt;body&gt; - mọi thành phần tự đổi màu.</div>
    </div>
    <div class="card">
        <div class="card-title">Chuyển màu mượt</div>
        <div class="card-text">Dùng <code>transition</code> để màu nền và chữ chuyển dần, không bị giật.</div>
    </div>
    <div class="note" id="note"></div>
    <script src="bai22.js"></script>
</body>
</html>
