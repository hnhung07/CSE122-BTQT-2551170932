<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bài 26</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
  <div class="container py-4">
    <div class="row justify-content-center">
      <div class="col-lg-8 col-xl-7">
        <div class="card shadow rounded-3 overflow-hidden border-0">
          <div class="card-header bg-success text-white text-center py-3">
            <h4 class="mb-0">Đăng ký tham gia CLB Lập trình Web</h4>
          </div>
          <div class="card-body p-4">
            <form id="registerForm" class="needs-validation" novalidate>
              <div class="row g-3">
                <div class="col-md-6">
                  <label for="hoten" class="form-label">Họ và tên</label>
                  <input type="text" class="form-control" id="hoten" name="hoten" placeholder="Nguyễn Văn A" required>
                  <div class="invalid-feedback">Vui lòng nhập họ và tên.</div>
                </div>

                <div class="col-md-6">
                  <label for="masv" class="form-label">Mã sinh viên</label>
                  <input type="text" class="form-control" id="masv" name="masv" placeholder="22xxxxxx" pattern="[0-9]{8,10}" required>
                  <div class="invalid-feedback">Mã sinh viên gồm 8-10 chữ số.</div>
                </div>

                <div class="col-md-6">
                  <label for="email" class="form-label">Email</label>
                  <input type="email" class="form-control" id="email" name="email" placeholder="sv@tlu.edu.vn" required>
                  <div class="invalid-feedback">Vui lòng nhập email hợp lệ.</div>
                </div>

                <div class="col-md-6">
                  <label for="sdt" class="form-label">Số điện thoại</label>
                  <input type="tel" class="form-control" id="sdt" name="sdt" placeholder="09xxxxxxxx" pattern="0[0-9]{9}" required>
                  <div class="invalid-feedback">Số điện thoại gồm 10 chữ số, bắt đầu bằng 0.</div>
                </div>

                <div class="col-12">
                  <label class="form-label d-block">Trình độ</label>
                  <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="trinhdo" id="td1" value="coban" checked>
                    <label class="form-check-label" for="td1">Cơ bản</label>
                  </div>
                  <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="trinhdo" id="td2" value="kha">
                    <label class="form-check-label" for="td2">Khá</label>
                  </div>
                  <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="trinhdo" id="td3" value="tot">
                    <label class="form-check-label" for="td3">Tốt</label>
                  </div>
                </div>

                <div class="col-12">
                  <label for="lop" class="form-label">Chọn lớp</label>
                  <select class="form-select" id="lop" name="lop" required>
                    <option value="" disabled selected>-- Chọn lớp của bạn --</option>
                    <option value="67CNTT1">67CNTT1</option>
                    <option value="67CNTT2">67CNTT2</option>
                    <option value="67CNTT3">67CNTT3</option>
                    <option value="67HTTT1">67HTTT1</option>
                  </select>
                  <div class="invalid-feedback">Vui lòng chọn lớp.</div>
                </div>

                <div class="col-12">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="camket" name="camket" required>
                    <label class="form-check-label" for="camket">Tôi cam kết tự làm bài và quay video OBS</label>
                    <div class="invalid-feedback">Bạn cần cam kết trước khi đăng ký.</div>
                  </div>
                </div>

                <div class="col-12">
                  <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                    <button type="reset" class="btn btn-outline-secondary px-3">Nhập lại</button>
                    <button type="submit" class="btn btn-success px-4">Đăng ký</button>
                  </div>
                </div>

              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="bai26.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
