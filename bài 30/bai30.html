<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bảng điều khiển - CSE.TLU Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .sidebar { width: 230px; background: #212529; color: #ffffff; }
    .sidebar .nav-link { color: #adb5bd; }
    .sidebar .nav-link.active { background: #0d6efd; color: #ffffff; }
    .progress { height: 6px; }
  </style>
</head>
<body>
    <div class="d-flex min-vh-100">
        <aside class="sidebar flex-shrink-0">
            <div class="px-3 py-3 borde-bottom border-secondary fw-bold fs-6">CSE.TLU Admin</div>
            <ul class="nav nav-pills flex-column p2 gap-1">
                <li class="nav-item"><a class="nav-link active" href="#">Bảng điều khiển</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Bài tập</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Sinh viên</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Điểm số</a></li>
            </ul>
        </aside>
        <main class="flex-grow-1 bg-light p-3" style="background: #e9ecef !important">
            <div class="d-flex justidy-content-between align-items-center mb-3">
                <h1 class="h3 mb-0">Bảng điều khiển</h1>
                <div class="d-flex align-items-center gap-2">
                    <span class="badge bg-warning text-dark">3 bài mới</span>
                    <button class="btn btn-primary btn-sm">Xuất báo cáo</button>
                </div>
            </div>
            <div class="row g-3 mb-3">
                <div class="col-md-3">
                    <div class="card border-0 shadow-sm">
                        <div class="card-body">
                            <div class="text-secondary">Sinh viên</div>
                            <div class="h2 fw-bold">128</div>
                            <div class="progress">
                                <div class="progres-bả bg-primary" style="width: 80%"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card border-0 shadow-sm">
                        <div class="card-body">
                            <div class="text-secondary">Đã nộp</div>
                            <div class="h2 fw-bold">96</div>
                            <div class="progress">
                                <div class="progres-bả bg-primary" style="width: 75%"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card border-0 shadow-sm">
                        <div class="card-body">
                            <div class="text-secondary">Chưa nộp</div>
                            <div class="h2 fw-bold">32</div>
                            <div class="progress">
                                <div class="progres-bả bg-primary" style="width: 25%"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card border-0 shadow-sm">
                        <div class="card-body">
                            <div class="text-secondary">Điểm TB</div>
                            <div class="h2 fw-bold">7.8</div>
                            <div class="progress">
                                <div class="progres-bả bg-primary" style="width: 75%"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white fw-bold">Tiến độ theo chương</div>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        Chương 1 - HTML5 <span class="badge bg-success">100%</span>
                    </li>
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        Chương 2 - JavaScript <span class="badge bg-info text-dark">82%</span>
                    </li>
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        Chương 3 - CSS3 <span class="badge bg-info text-dark">74%</span>
                    </li>
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        Chương 4 - Bootstrap 5 <span class="badge bg-secondary">45%</span>
                    </li>
                </ul>
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
